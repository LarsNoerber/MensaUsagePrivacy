<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="description" content="MensaView: Impressum und zweisprachige Datenschutzerklärung">
  <meta name="theme-color" content="#193b32">
  <title>MensaView — Impressum & Datenschutz</title>
  <style>
    :root{font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;color:#193b32;background:#f6f4ef;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0,#dbe7dc 0,transparent 42%),#f6f4ef}
    main{max-width:58rem;margin:0 auto;padding:1.4rem 1rem 4rem}
    header{padding:1.3rem 0 1rem}
    .brand{display:flex;align-items:center;gap:.75rem;font-weight:800;font-size:1.1rem}
    .logo{width:2.8rem;height:2.8rem;display:grid;place-items:center;border-radius:.9rem;background:#193b32;color:white;font-size:1.5rem}
    nav{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.1rem 0}
    nav a,.contents a{color:#193b32}
    nav a{padding:.4rem .85rem;border:1px solid #b5c8bb;border-radius:999px;background:#fff;text-decoration:none;font-weight:650}
    h1{font-size:clamp(2rem,6vw,3rem);line-height:1.15;letter-spacing:-.03em;margin:.5rem 0}
    h2{font-size:1.35rem;line-height:1.3;margin:0 0 .8rem}
    .updated,.eyebrow{color:#527266}
    .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:750}
    section{margin:1rem 0;padding:clamp(1.1rem,4vw,1.7rem);border:1px solid #d7e0d9;border-radius:1rem;background:#fff;box-shadow:0 8px 22px #193b3210}
    section p{margin:.2rem 0 1rem;overflow-wrap:anywhere}
    section p:last-child{margin-bottom:0}
    .contents{padding:1rem 1.2rem;background:#edf3ee}
    .contents strong{display:block;margin-bottom:.45rem}
    .contents a{display:inline-block;padding:.15rem .3rem;margin:.05rem .3rem .05rem 0}
    a{color:#185c48;overflow-wrap:anywhere}
    #notice{padding:1rem;border-radius:.8rem;background:#fff3d6;color:#5d4614}
    footer{text-align:center;color:#527266;padding:1.5rem 0;font-size:.9rem}
    :focus-visible{outline:3px solid #d97935;outline-offset:3px}
    @media(max-width:520px){main{padding-top:.5rem}header{padding-top:.5rem}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true">🍽</span><span>MensaView</span></div>
    <nav aria-label="Language">
      <a href="?lang=de" lang="de">Deutsch</a>
      <a href="?lang=en" lang="en">English</a>
    </nav>
    <p class="eyebrow">MensaView · Legal</p>
    <h1 id="page-title">Impressum &amp; Datenschutz</h1>
    <p class="updated" id="updated"></p>
  </header>
  <div id="notice" role="status">Datenschutzhinweise werden geladen …</div>
  <nav class="contents" id="contents" aria-label="Inhalt" hidden></nav>
  <div id="policy"></div>
  <footer id="footer"></footer>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const language = params.get("lang") === "en" || (!params.has("lang") && navigator.language.toLowerCase().startsWith("en")) ? "en" : "de";
  const de = language === "de";
  document.documentElement.lang = language;
  document.title = de ? "MensaView — Impressum & Datenschutz" : "MensaView — Legal notice & privacy";
  document.getElementById("page-title").textContent = de ? "Impressum & Datenschutz" : "Legal notice & privacy";
  document.getElementById("contents").setAttribute("aria-label", de ? "Inhalt" : "Contents");
  document.querySelector('a[href="?lang=de"]').setAttribute("aria-current", de ? "page" : "false");
  document.querySelector('a[href="?lang=en"]').setAttribute("aria-current", de ? "false" : "page");
  const root = document.getElementById("policy");
  const notice = document.getElementById("notice");

  function paragraphs(target, value) {
    (value || "").split(/\n\s*\n/).filter(Boolean).forEach((part) => {
      const p = document.createElement("p");
      const pieces = part.split(/(https?:\/\/[^\s]+|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/ig);
      pieces.forEach((piece) => {
        if (/^https?:\/\//i.test(piece)) {
          const a = document.createElement("a");
          a.href = piece;
          a.textContent = piece;
          a.rel = "noreferrer noopener";
          p.appendChild(a);
        } else if (/^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i.test(piece)) {
          const a = document.createElement("a");
          a.href = "mailto:" + piece;
          a.textContent = piece;
          p.appendChild(a);
        } else {
          p.appendChild(document.createTextNode(piece));
        }
      });
      target.appendChild(p);
    });
  }

  function section(id, title, body) {
    const article = document.createElement("section");
    article.id = id;
    const h = document.createElement("h2");
    h.textContent = title;
    article.appendChild(h);
    paragraphs(article, body);
    root.appendChild(article);
  }

  const base = new URL(".", location.href);
  fetch(new URL("policy.json", base), {headers: {"Accept": "application/json"}})
    .then((response) => {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then((policy) => {
      if (policy.schema !== 1 || !policy[language] || !Array.isArray(policy[language].privacySections)) {
        throw new Error("Invalid policy");
      }
      const data = policy[language];
      document.getElementById("updated").textContent =
        (de ? "Stand: " : "Updated: ") + policy.updatedAt + " · " + policy.policyRevision;
      const contents = document.getElementById("contents");
      const label = document.createElement("strong");
      label.textContent = de ? "Auf dieser Seite" : "On this page";
      contents.appendChild(label);
      const imprintId = "imprint";
      const imprintLink = document.createElement("a");
      imprintLink.href = "#" + imprintId;
      imprintLink.textContent = de ? "Impressum" : "Publisher information";
      contents.appendChild(imprintLink);
      const imprint = document.createElement("section");
      imprint.id = imprintId;
      const imprintHeading = document.createElement("h2");
      imprintHeading.textContent = de ? "Impressum" : "Publisher information";
      imprint.appendChild(imprintHeading);
      paragraphs(imprint, data.imprint);
      root.appendChild(imprint);

      data.privacySections.forEach((item, index) => {
        const id = "privacy-" + (index + 1);
        const link = document.createElement("a");
        link.href = "#" + id;
        link.textContent = item.title;
        contents.appendChild(link);
        section(id, item.title, item.body);
      });

      const rightsId = "rights";
      const rightsLink = document.createElement("a");
      rightsLink.href = "#" + rightsId;
      rightsLink.textContent = de ? "Deine Rechte" : "Your rights";
      contents.appendChild(rightsLink);
      section(rightsId, de ? "Deine Rechte" : "Your rights", data.rights);
      contents.hidden = false;
      notice.hidden = true;
      document.getElementById("footer").textContent = de
        ? "MensaView ist eine unabhängige App und nicht mit MensaMax oder MensaDigital verbunden."
        : "MensaView is an independent app and is not affiliated with MensaMax or MensaDigital.";
    })
    .catch(() => {
      notice.textContent = de
        ? "Die Datenschutzhinweise konnten nicht geladen werden. Prüfe die Verbindung und lade die Seite erneut."
        : "The privacy notice could not be loaded. Check your connection and reload the page.";
    });
})();
</script>
</body>
</html>
